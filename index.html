<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Market</title>

<style>
body{
font-family:tahoma;
background:#f3f4f6;
margin:0;
}

header{
background:#111827;
color:white;
padding:30px;
text-align:center;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:30px;
}

.card{
background:white;
width:280px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #ddd;
text-align:center;
}

.price{
font-size:22px;
color:#2563eb;
font-weight:bold;
}

button{
background:#2563eb;
color:white;
border:0;
padding:12px 25px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

footer{
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>
<h1>AI Market</h1>
<p>خرید و تمدید اشتراک هوش مصنوعی</p>
</header>


<section class="products">

<div class="card">
<h2>ChatGPT Plus</h2>
<p>دستیار هوش مصنوعی حرفه‌ای</p>
<div class="price">تماس بگیرید</div>
<br>
<button>سفارش</button>
</div>


<div class="card">
<h2>Claude Pro</h2>
<p>هوش مصنوعی برای کارهای تخصصی</p>
<div class="price">تماس بگیرید</div>
<br>
<button>سفارش</button>
</div>


<div class="card">
<h2>Gemini Advanced</h2>
<p>هوش مصنوعی گوگل</p>
<div class="price">تماس بگیرید</div>
<br>
<button>سفارش</button>
</div>

</section>


<footer>
<p>پشتیبانی تلگرام: @YourID</p>
</footer>

</body>
</html>
