<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Subscription Store</title>

<style>
body {
    font-family: Tahoma, Arial;
    background:#f5f5f5;
    margin:0;
    padding:0;
}

header {
    background:#111827;
    color:white;
    padding:30px;
    text-align:center;
}

.container {
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card {
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:12px;
    box-shadow:0 3px 10px #ddd;
}

button {
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}

button:hover {
    background:#1d4ed8;
}
</style>

</head>

<body>

<header>
<h1>AI Subscription Store</h1>
<p>خرید و تمدید سرویس‌های هوش مصنوعی</p>
</header>


<div class="container">

<div class="card">
<h2>ChatGPT Plus</h2>
<p>اشتراک هوش مصنوعی برای تولید محتوا، برنامه‌نویسی و تحقیق</p>
<button>خرید</button>
</div>


<div class="card">
<h2>Claude Pro</h2>
<p>دستیار هوشمند برای کارهای حرفه‌ای</p>
<button>خرید</button>
</div>


<div class="card">
<h2>Gemini Advanced</h2>
<p>سرویس هوش مصنوعی گوگل</p>
<button>خرید</button>
</div>


<div class="card">
<h2>تماس با ما</h2>
<p>تلگرام: @YourID</p>
</div>

</div>

</body>
</html>
